name: Restyle Planejamento Colaborativo

on:
  push:
    branches: [main]
    paths:
      - '.github/restyle-trigger.txt'

permissions:
  contents: write

jobs:
  restyle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar novo visual sem alterar dados e integrações
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('Planejamento-Colaborativo/index.html')
          html = path.read_text(encoding='utf-8')

          start = '<!-- SINAPE_VISUAL_V2_START -->'
          end = '<!-- SINAPE_VISUAL_V2_END -->'
          css = r'''
          <style id="sinape-visual-v2">
          /* SINAPE VISUAL V2 - somente apresentação */
          :root{
            --paper:#edf3f6;
            --line:#d7e2e8;
            --shadow:0 12px 30px rgba(8,43,64,.09);
          }
          html{scroll-padding-top:78px}
          body{
            font-size:15px;
            background:
              radial-gradient(circle at 8% 0%,rgba(41,169,199,.08),transparent 26%),
              linear-gradient(180deg,#f7fafb 0,#edf3f6 340px,#edf3f6 100%);
          }
          .cover{
            width:calc(100% - 32px);
            max-width:none;
            min-height:118px;
            margin:16px 16px 0;
            border-radius:20px 20px 0 0;
            box-shadow:0 16px 36px rgba(4,35,53,.18);
          }
          .cover-inner{grid-template-columns:minmax(520px,1.1fr) minmax(430px,1.15fr) minmax(280px,.58fr);min-height:118px}
          .cover-brand{gap:20px;padding:17px 24px;background:linear-gradient(120deg,#062b43 0%,#0a526d 100%)}
          .cover-brand img{width:112px;height:82px;border-radius:13px;padding:6px;box-shadow:0 8px 22px rgba(0,18,29,.32)}
          .cover-copy h1{font-size:clamp(27px,2.1vw,36px);margin-bottom:8px;letter-spacing:-.035em}
          .cover-copy p{font-size:12px;color:#e4f4f8}
          .cover-road{min-height:118px;background-position:center 57%}
          .cover-source{padding:18px 24px;background:linear-gradient(135deg,#0c5671,#123e55);font-size:10px}
          .cover-source b{font-size:10px}.cover-source span{font-size:9px}

          main{max-width:none;padding:0 16px 58px}
          .filter-shell{
            padding:17px 18px 15px;
            margin-bottom:14px;
            border-radius:0 0 20px 20px;
            background:linear-gradient(105deg,#0d4e68 0%,#14748e 62%,#0d526c 100%);
            box-shadow:0 14px 32px rgba(8,43,64,.16);
          }
          .filters{grid-template-columns:1.05fr 1.35fr .72fr .9fr .92fr auto;gap:12px}
          .field>span{font-size:10px;color:#d8edf4;margin-bottom:7px}
          .field select,.multi-button{height:44px;border-radius:9px;padding:0 12px;font-size:11px;background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.28)}
          .field select:focus,.multi-button:focus{box-shadow:0 0 0 3px rgba(255,255,255,.16)}
          .advanced-btn{height:44px;border-radius:9px;padding:0 15px;font-size:10px;box-shadow:0 7px 16px rgba(3,37,53,.13)}
          .clear-btn{height:44px;font-size:10px}
          .filter-foot{font-size:9px;margin-top:13px;padding-top:10px}
          .week-menu{top:69px;border-radius:11px;padding:8px;box-shadow:0 18px 38px rgba(8,43,64,.18)}
          .week-menu label{font-size:11px;padding:9px}

          .reference-cards{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0 23px}
          .reference-card{
            position:relative;
            min-height:96px;
            display:grid;
            grid-template-columns:48px 1fr;
            grid-template-rows:auto auto 1fr;
            column-gap:12px;
            align-items:center;
            padding:15px 16px;
            border:1px solid #d7e4ea;
            border-top:0;
            border-radius:14px;
            box-shadow:0 8px 22px rgba(8,43,64,.07);
            overflow:hidden;
          }
          .reference-card:before{
            content:'$';
            grid-row:1/4;
            width:46px;height:46px;border-radius:50%;
            display:grid;place-items:center;
            color:#fff;font-size:22px;font-weight:900;
            background:linear-gradient(145deg,#087895,#16a7b6);
            box-shadow:0 7px 16px rgba(17,128,153,.24);
          }
          .reference-card:nth-child(2):before{content:'◫';font-size:20px}
          .reference-card:nth-child(3):before{content:'●';font-size:16px}
          .reference-card:nth-child(4):before{content:'●●';font-size:10px;letter-spacing:-2px}
          .reference-card:after{content:'';position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,#0a7895,#23b0bd)}
          .reference-card span{font-size:9px;align-self:end}
          .reference-card strong{font-size:21px;margin:2px 0 0;line-height:1.05}
          .reference-card small{font-size:9px;margin-top:5px;line-height:1.35}

          .sinape-nav.section-nav{
            position:sticky;top:10px;z-index:45;
            margin:0 0 22px;padding:8px;
            border:1px solid rgba(202,218,226,.8);
            border-radius:13px;
            background:rgba(244,248,250,.91);
            backdrop-filter:blur(14px);
            box-shadow:0 8px 22px rgba(8,43,64,.08);
          }
          .sinape-nav.section-nav a{font-size:10px;padding:9px 14px;border-radius:22px}
          .sinape-nav.section-nav a:first-child{color:#fff;background:linear-gradient(135deg,#0a607c,#1592a9);border-color:transparent}

          .section-block{margin-bottom:36px;scroll-margin-top:78px}
          .section-title{margin-bottom:14px;align-items:center}
          .section-number{width:36px;height:36px;border-radius:9px;font-size:11px;background:linear-gradient(145deg,#07516d,#0b87a0);box-shadow:0 6px 14px rgba(6,81,109,.2)}
          .section-title h2{font-size:23px;letter-spacing:-.025em;margin:2px 0}
          .section-title p{font-size:10px}
          .kicker{font-size:10px;color:#0983a2}
          .period-view{font-size:10px;padding:8px 12px;background:#dff1f6}

          .panel{border-radius:16px;border-color:#d8e4ea;box-shadow:0 9px 24px rgba(8,43,64,.065);margin-bottom:14px;overflow:hidden}
          .panel-inner{padding:21px}
          .panel-head{margin-bottom:17px}
          .panel-head h3{font-size:17px;letter-spacing:-.015em}
          .hint,.legend{font-size:9px}.legend i{width:10px;height:10px;border-radius:3px}

          .cards{gap:12px;margin-bottom:14px}
          .card{min-height:154px;border-radius:14px;padding:19px 20px;box-shadow:0 9px 24px rgba(8,43,64,.07);border-color:#d6e3e9}
          .card:before{width:5px}
          .card-label{font-size:9px;letter-spacing:.08em}
          .card strong{font-size:30px;margin:17px 0 7px}
          .card small{font-size:9px;line-height:1.5}
          .mini-status{font-size:9px;margin-top:13px}
          .cards .card:nth-child(1),.cards .card:nth-child(2){border:0;background:linear-gradient(135deg,#087790 0%,#0b9aa8 100%);color:#fff}
          .cards .card:nth-child(2){background:linear-gradient(135deg,#075f80 0%,#0d849d 100%)}
          .cards .card:nth-child(1):before,.cards .card:nth-child(2):before{display:none}
          .cards .card:nth-child(1) .card-label,.cards .card:nth-child(2) .card-label,
          .cards .card:nth-child(1) strong,.cards .card:nth-child(2) strong,
          .cards .card:nth-child(1) small,.cards .card:nth-child(2) small,
          .cards .card:nth-child(1) .mini-status,.cards .card:nth-child(2) .mini-status{color:#fff}
          .cards .card:nth-child(1) .mini-status i,.cards .card:nth-child(2) .mini-status i{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
          .cards .card:nth-child(3),.cards .card:nth-child(4){border:1.5px solid #5bb2c7}

          .chart-grid{grid-template-columns:1.08fr 1fr;gap:14px}
          .chart,.weekly-grid{height:285px;padding-top:10px;background:repeating-linear-gradient(to top,transparent 0,transparent 54px,rgba(151,177,189,.18) 55px)}
          .bar-area{height:220px;gap:5px}
          .bar{width:17px;border-radius:5px 5px 0 0;transition:.2s transform,.2s filter}
          .bar.plan,.week-bars .wp{background:linear-gradient(180deg,#20aeb3,#0d7e92)}
          .bar.done,.week-bars .we{background:linear-gradient(180deg,#185eb3,#0b418a)}
          .bar-group:hover .bar{transform:translateY(-3px);filter:brightness(1.05)}
          .bar-group b{font-size:10px;padding-top:9px}.bar-group small{font-size:8px}
          .week{min-width:128px}.week-bars{height:195px;gap:9px}.week-bars i{width:28px;border-radius:5px 5px 0 0}.week strong{font-size:9px}.week small{font-size:8px}

          .executive-lower{grid-template-columns:minmax(330px,.72fr) minmax(660px,1.28fr);gap:14px}
          .critical-map{gap:10px}
          .critical-cell{min-height:118px;border-radius:12px;padding:16px;transition:.2s transform,.2s box-shadow}
          .critical-cell:hover{transform:translateY(-2px);box-shadow:0 9px 20px rgba(8,43,64,.09)}
          .critical-cell:has(.signal.red){background:linear-gradient(135deg,#fff,#fff2f2);border-color:#efc4c4}
          .critical-cell:has(.signal.amber){background:linear-gradient(135deg,#fff,#fff8e9);border-color:#ead09c}
          .critical-cell span{font-size:9px}.critical-cell strong{font-size:25px}.critical-cell small{font-size:9px;line-height:1.45}
          .signal{width:11px;height:11px}

          .contract-kpis{gap:12px}
          .contract-kpi{min-height:126px;border-radius:14px;padding:16px;grid-template-columns:50px 1fr}
          .contract-kpi-icon{width:50px;height:50px;font-size:24px}
          .contract-kpi-copy span{font-size:9px}.contract-kpi-copy strong{font-size:27px}.contract-kpi-copy small{font-size:9px}
          .contract-track{height:38px;border-radius:11px}.contract-track span{font-size:10px}
          .contract-summary{border-radius:13px;padding:15px}.contract-summary h4{font-size:12px}.contract-summary p{font-size:9px}

          .actions-grid{grid-template-columns:1fr 1.25fr .7fr .55fr .65fr}
          .actions-grid>div{padding:12px;font-size:10px}.actions-grid .head{font-size:9px}
          .action-form{gap:10px}.action-form label{font-size:8px}.action-form input,.action-form select{min-height:39px;font-size:10px}

          .planning-viewport{border-radius:15px;scrollbar-color:#78a9b9 #e5eef2}
          .planning-table{font-size:11px}
          .planning-table th{padding:13px 11px;font-size:9px;letter-spacing:.045em;background:#f0f5f7}
          .planning-table td{padding:12px 10px}
          .planning-table .item-col{min-width:310px;max-width:310px}
          .planning-table .balance-col{min-width:235px;background:#eff9f6}
          .planning-table th.balance-col{background:linear-gradient(135deg,#08778c,#075d6f)}
          .planning-table th.window-active{color:#fff;background:linear-gradient(180deg,#16a6b1,#08778c);box-shadow:inset 0 -4px 0 #0d5265}
          .planning-table td.window-active{background:#f1fbfd;box-shadow:inset 1px 0 rgba(55,155,179,.13),inset -1px 0 rgba(55,155,179,.13)}
          .planning-table .month-col.window-muted{opacity:.58;filter:saturate(.55)}
          .planning-table tbody tr:nth-child(even) td:not(.window-active):not(.balance-col){background:#fbfcfd}
          .planning-table tbody tr:hover td{background:#eef8fb!important}
          .planning-table .item-col strong{font-size:11px}.planning-table .item-col small{font-size:9px}
          .month-boxes{gap:7px}.month-box{border-radius:9px;padding:9px}.month-box span{font-size:8px}.month-box b{font-size:11px}.month-box small{font-size:8px}
          .month-box.plan.has-value{border-color:#21a5b6;background:#ddf4f8;box-shadow:0 4px 12px rgba(11,105,129,.09)}
          .balance-col strong{font-size:15px}.balance-col small{font-size:9px}
          .compact-btn,.weekly-trigger{min-height:30px;border-radius:7px;font-size:8px}

          .weekly-plan-item{border-radius:11px;padding:13px}.weekly-plan-item>strong{font-size:11px}.weekly-plan-item>small{font-size:9px}
          .weekly-plan-cell{border-radius:9px;padding:10px}.weekly-plan-cell b{font-size:9px}.weekly-plan-cell span{font-size:13px}.weekly-plan-cell small{font-size:8px}

          .data-table{font-size:11px}.data-table th{font-size:9px;padding:12px}.data-table td{padding:12px}.data-table small{font-size:9px}
          .os-code{font-size:9px;padding:7px 10px;border-radius:7px}
          .status-pill{font-size:9px;padding:6px 10px;border-radius:16px}.status-pill i{width:7px;height:7px}
          .secondary-btn{font-size:9px;padding:9px 12px;border-radius:8px}
          .ops-reading{grid-template-columns:280px 1fr;gap:16px}.ops-total{border-radius:13px;padding:24px}.ops-total span{font-size:10px}.ops-total strong{font-size:44px}.ops-total small{font-size:10px}
          .ops-list{gap:9px}.ops-item{padding:12px 14px;border-radius:11px}.ops-item strong{font-size:11px}.ops-item small{font-size:9px}
          .rdo-card{grid-template-columns:210px 1fr;border-radius:13px}.rdo-week{padding:24px}.rdo-week span{font-size:9px}.rdo-week strong{font-size:24px}.rdo-content{padding:20px}
          .rdo-empty{font-size:11px;padding:24px}

          .drawer{width:min(520px,95vw);padding:30px}.drawer h3{font-size:25px}.drawer p{font-size:11px}.drawer-value{font-size:39px}.drawer-list dt,.drawer-list dd,.drawer-note{font-size:10px}
          .planning-modal{border-radius:17px}.planning-modal-head{padding:19px 21px}.planning-modal-head h3{font-size:17px}.planning-modal-head p{font-size:9px}.planning-modal-body{padding:19px}

          .access-gate{background:linear-gradient(135deg,rgba(4,42,61,.98),rgba(4,112,132,.96))}
          .access-card{width:min(470px,100%);border-radius:20px;padding:34px;box-shadow:0 28px 80px rgba(0,20,30,.45)}
          .access-card h2{font-size:27px}.access-card>p{font-size:12px}.access-form label{font-size:10px}.access-form input{height:50px;font-size:14px;border-radius:10px}.access-form button{height:48px;font-size:11px;border-radius:10px}

          @media(max-width:1250px){
            .cover-inner{grid-template-columns:1.12fr .95fr}.cover-source{display:none}
            .filters{grid-template-columns:repeat(3,1fr)}
            .chart-grid,.executive-lower{grid-template-columns:1fr}
            .cards{grid-template-columns:repeat(2,1fr)}
          }
          @media(max-width:820px){
            .cover{width:calc(100% - 20px);margin:10px 10px 0}.cover-inner{display:block}.cover-road{display:none}
            .cover-brand img{width:88px;height:66px}.cover-copy h1{font-size:25px}
            main{padding:0 10px 40px}.filter-shell{padding:14px}.filters{grid-template-columns:1fr 1fr}
            .reference-cards{grid-template-columns:1fr 1fr}.reference-card{min-height:88px}
            .sinape-nav.section-nav{top:6px}.section-title h2{font-size:20px}
            .contract-kpis,.contract-summaries{grid-template-columns:1fr}.ops-reading,.rdo-card{grid-template-columns:1fr}
          }
          @media(max-width:520px){
            .filters,.cards,.reference-cards{grid-template-columns:1fr}
            .reference-card{grid-template-columns:44px 1fr}.reference-card:before{width:42px;height:42px}
            .section-title{align-items:flex-start}.period-view{display:none}
            .planning-table .item-col{min-width:225px;max-width:225px}.planning-table .month-col{width:185px;min-width:185px}
            .planning-table .balance-col{min-width:190px}.card strong{font-size:27px}
          }
          @media print{
            .sinape-nav{display:none!important}.cover{width:100%;margin:0}.panel,.card,.reference-card{box-shadow:none}
          }
          </style>
          '''
          block = start + css + end
          pattern = re.compile(re.escape(start) + r'.*?' + re.escape(end), re.S)
          if start in html:
              html = pattern.sub(block, html)
          else:
              html = html.replace('</head>', block + '</head>', 1)

          nav = '<nav class="section-nav sinape-nav" aria-label="Navegação do painel"><a href="#executivo">Visão executiva</a><a href="#planejamento">Planejamento 3 meses</a><a href="#operacao">Ordens de Serviço</a><a href="#rdo">RDO</a></nav>'
          if 'class="section-nav sinape-nav"' not in html:
              html = html.replace('<section class="section-block" id="executivo">', nav + '<section class="section-block" id="executivo">', 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Publicar alteração visual
        shell: bash
        run: |
          git config user.name "SINAPE Layout Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Planejamento-Colaborativo/index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Atualiza visual do Planejamento Colaborativo"
          git push
