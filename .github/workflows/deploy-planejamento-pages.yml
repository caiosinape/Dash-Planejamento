name: Publicar Planejamento Colaborativo

on:
  push:
    branches:
      - main
    paths:
      - "Planejamento-Colaborativo/**"
      - ".github/workflows/deploy-planejamento-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-planejamento-colaborativo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar estrutura preservando o endereco atual
        run: |
          mkdir -p _site/Planejamento-Colaborativo
          cp -R Planejamento-Colaborativo/. _site/Planejamento-Colaborativo/
          touch _site/.nojekyll

      - name: Enviar arquivos para publicacao
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
