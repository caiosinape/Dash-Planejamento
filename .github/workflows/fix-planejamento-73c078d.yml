name: Validar carga Planejamento 73c078d

on:
  push:
    branches:
      - planejamento-colaborativo-fix-73c078d
    paths:
      - 'Planejamento-Colaborativo/.fix73/ready.txt'

permissions:
  contents: write

concurrency:
  group: planejamento-colaborativo-fix-73c078d
  cancel-in-progress: false

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch de correção
        uses: actions/checkout@v4
        with:
          ref: planejamento-colaborativo-fix-73c078d
          fetch-depth: 0

      - name: Buscar carga da main
        shell: bash
        run: git fetch origin main

      - name: Decodificar e validar sem alterar o HTML
        shell: bash
        run: |
          set -euo pipefail
          DECODE_ONLY=1 PYTHONPATH=tools python tools/run_fix_planejamento_73.py

      - name: Gravar auditoria da decodificação
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Planejamento-Colaborativo/direct-overrides-decoded-audit.json'
          git commit -m '[decode73] Valida 650 registros e totais mensais' || exit 0
          git push origin HEAD:planejamento-colaborativo-fix-73c078d
