name: Diagnosticar carga Planejamento 73c078d

on:
  push:
    branches:
      - planejamento-colaborativo-fix-73c078d
    paths:
      - 'Planejamento-Colaborativo/.fix73/ready.txt'

permissions:
  contents: write

concurrency:
  group: planejamento-colaborativo-fix-73c078d
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch de correção
        uses: actions/checkout@v4
        with:
          ref: planejamento-colaborativo-fix-73c078d
          fetch-depth: 0

      - name: Buscar carga da main
        shell: bash
        run: git fetch origin main

      - name: Diagnosticar formato sem alterar o HTML
        shell: bash
        run: |
          set -euo pipefail
          python tools/diagnose_direct_overrides.py

      - name: Gravar diagnóstico na branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Planejamento-Colaborativo/direct-overrides-shape.json'
          git commit -m '[diagnostic73] Registra formato real da carga compactada' || exit 0
          git push origin HEAD:planejamento-colaborativo-fix-73c078d
