name: Aplicar Regras do Word nos Cronogramas

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aplicar-regras-word-cronogramas.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar e validar regras
        shell: python
        run: |
          import base64, gzip, json, re, traceback
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          status = Path("Cronogramas Planejamento/word-update-status.txt")
          try:
              html_path = Path("Cronogramas Planejamento/index.html")
              html = html_path.read_text(encoding="utf-8")
              match = re.search(r"(?m)^\s*var contractData=(\{.*\});\s*$", html)
              if not match:
                  raise RuntimeError("contractData não encontrado")
              data = json.loads(match.group(1))
              encoded = Path("Cronogramas Planejamento/initial-balances-word.b64").read_text(encoding="ascii").strip()
              balances = json.loads(gzip.decompress(base64.b64decode(encoded)).decode("utf-8"))
              matched = 0
              for rows in data.values():
                  for item in rows:
                      source_id = item.get("sourceId")
                      item["initialBalance"] = balances.get(source_id, item.get("initialBalance", 0))
                      if source_id in balances:
                          matched += 1
              compact = json.dumps(data, ensure_ascii=False, separators=(",", ":"), allow_nan=False)
              html = html[:match.start()] + "    var contractData=" + compact + ";" + html[match.end():]

              replacements = {
                  "plannedValue": '''function plannedValue(m){
      if(m>5)return 0;
      return filtered(true).reduce(function(s,i){return s+Number(i.plan[m]||0)*Number(i.price||0)},0)
    }''',
                  "executedValue": '''function executedValue(m){
      if(m>5)return 0;
      return filtered(true).reduce(function(s,i){return s+executedQty(i,m)*Number(i.price||0)},0)
    }''',
                  "balanceUpdated": '''function balanceUpdated(item,startMonth){
      var balance=Number(item.initialBalance||0),endMonth=Math.min(startMonth+3,12);
      for(var m=executionStartMonth;m<endMonth;m++)balance-=isClosed(m)?executedQty(item,m):Number(item.plan[m]||0);
      return balance
    }''',
                  "remainingBalance": '''function remainingBalance(item){return Number(item.initialBalance||0)-executedSinceModelBase(item)}''',
                  "consumedQuantity": '''function consumedQuantity(item){return Math.max(0,Number(item.contractual||0)-remainingBalance(item))}'''
              }
              for name, body in replacements.items():
                  start = html.find("function " + name + "(")
                  if start < 0:
                      raise RuntimeError("Função não encontrada: " + name)
                  end = html.find("\n    function ", start + 10)
                  if end < 0:
                      raise RuntimeError("Fim da função não encontrado: " + name)
                  html = html[:start] + body + html[end:]

              old = 'for(var n=m;n<Math.min(m+3,12);n++)if(plannedValue(n)>0)horizon++;'
              new = 'for(var n=m;n<Math.min(m+3,12);n++)if(filtered(true).some(function(i){return Number(i.plan[n]||0)>0}))horizon++;'
              if old in html:
                  html = html.replace(old, new, 1)

              html = html.replace('Quantidade planejada × preço unitário do recorte','R$ Realista × Preço Unit. · janeiro a junho',1)
              html = html.replace('Fonte: Base BI Executado (2)</small>','R$ Executado × Preço Unit. · janeiro a junho</small>',1)
              html = html.replace('Saldo anterior − consumo da janela de 3 meses','Saldo inicial da coluna J − planejado; mês fechado usa executado')

              now = datetime.now(ZoneInfo("America/Sao_Paulo"))
              stamp = now.strftime("%d/%m/%Y %H:%M")
              html = re.sub(r"Atualização: \d{2}/\d{2}/\d{4} \d{2}:\d{2}", f"Atualização: {stamp}", html, count=1)
              html = re.sub(r"Atualizado em \d{2}/\d{2}/\d{4} \d{2}:\d{2}", f"Atualizado em {stamp}", html, count=1)

              required = ['if(m>5)return 0;','R$ Realista × Preço Unit. · janeiro a junho','R$ Executado × Preço Unit. · janeiro a junho','Number(item.initialBalance||0)','isClosed(m)?executedQty(item,m):Number(item.plan[m]||0)']
              missing = [value for value in required if value not in html]
              if missing:
                  raise RuntimeError("Validações ausentes: " + repr(missing))
              if matched < 500:
                  raise RuntimeError(f"Poucos saldos associados: {matched}")

              html_path.write_text(html, encoding="utf-8")
              status.write_text(f"SUCESSO\nSaldos associados: {matched}\nAtualização: {stamp}\n", encoding="utf-8")
          except Exception:
              status.write_text("ERRO\n" + traceback.format_exc(), encoding="utf-8")

      - name: Publicar resultado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Cronogramas Planejamento/index.html" "Cronogramas Planejamento/word-update-status.txt"
          if grep -q '^SUCESSO' "Cronogramas Planejamento/word-update-status.txt"; then
            git commit -m "Atualiza cards gráfico e saldo conforme Word" || exit 0
          else
            git commit -m "Registra diagnóstico da atualização conforme Word" || exit 0
          fi
          git push
