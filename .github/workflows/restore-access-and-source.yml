name: Restore Access and Source

# Fluxo legado mantido apenas para consulta manual.
# A atualização do painel e da base é feita diretamente no repositório,
# sem arquivos de gatilho e sem substituir trechos frágeis do HTML.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Informar modo seguro
        run: |
          echo "O fluxo automático de restauração foi desativado."
          echo "A tela de e-mail, os vínculos e os dados devem ser validados antes de qualquer publicação direta."
