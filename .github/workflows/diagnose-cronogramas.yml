name: Diagnosticar HTML Cronogramas

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-cronogramas.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair funções relevantes
        shell: python
        run: |
          import re
          from pathlib import Path

          html = Path("Cronogramas Planejamento/index.html").read_text(encoding="utf-8")
          names = [
              "plannedValue", "executedValue", "executedQty", "allPlanned", "allExecuted",
              "renderCards", "renderMonthChart", "renderPlanning", "remainingBalance",
              "consumedQuantity", "newExecutedTotal", "executedSinceModelBase", "activeMonth"
          ]
          chunks = []
          for name in names:
              marker = "function " + name + "("
              start = html.find(marker)
              if start < 0:
                  chunks.append(f"===== {name} =====\nNÃO ENCONTRADA\n")
                  continue
              next_pos = html.find("\n    function ", start + len(marker))
              if next_pos < 0:
                  next_pos = min(len(html), start + 12000)
              chunks.append(f"===== {name} =====\n{html[start:next_pos].strip()}\n")

          for term in ["executionStartMonth", "Quant. Total JULHO", "contractual", "base:"]:
              positions = [m.start() for m in re.finditer(re.escape(term), html)]
              for pos in positions[:8]:
                  chunks.append(f"===== termo {term} @ {pos} =====\n{html[max(0,pos-800):min(len(html),pos+1600)]}\n")

          out = Path("Cronogramas Planejamento/debug-functions.txt")
          out.write_text("\n".join(chunks), encoding="utf-8")
          print(f"Bytes: {out.stat().st_size}")

      - name: Publicar diagnóstico
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Cronogramas Planejamento/debug-functions.txt"
          git commit -m "Gera diagnóstico das funções do cronograma" || exit 0
          git push
