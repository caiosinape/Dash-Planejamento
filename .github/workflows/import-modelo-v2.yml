name: Importar Modelo Cronograma V2

on:
  push:
    branches: [main]
    paths:
      - '.github/import-modelo-v2-trigger.txt'

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    env:
      XLSX_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-2654-820e-98a6-c24cef712a42/raw?se=2026-07-29T19:09:44Z&sp=r&sv=2026-02-06&sr=b&scid=fc6285ae-6996-5388-9ba1-4c3d5185e1b7&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-29T11:58:01Z&ske=2026-07-31T11:58:01Z&sks=b&skv=2026-02-06&sig=VDlXEbwuC9bSa6zh0PAyIHsuuG5lFt7dFP8%2BHuk1UUo%3D"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar HTML oficial estável
        run: git show 73c078d3780f21911bbf5a5dbb3f280bbf7f4f22:Planejamento-Colaborativo/index.html > Planejamento-Colaborativo/index.html

      - name: Preparar dependências
        run: pip install openpyxl

      - name: Baixar planilha v2
        run: curl -L --fail --retry 3 "$XLSX_URL" -o /tmp/modelo-v2.xlsx

      - name: Importar dados conforme documento de orientação
        run: python .github/scripts/import_modelo_v2_correct.py

      - name: Validar resultado
        run: |
          test -s Planejamento-Colaborativo/model-v2-data.js
          grep -q 'planValue' Planejamento-Colaborativo/model-v2-data.js
          grep -q 'b=""' Planejamento-Colaborativo/index.html
          grep -q 'Quantidade executada</th>' Planejamento-Colaborativo/index.html

      - name: Publicar atualização
        run: |
          git config user.name "SINAPE Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Planejamento-Colaborativo/index.html Planejamento-Colaborativo/model-v2-data.js
          git commit -m "Corrige planejado e executado conforme Modelo Cronograma v2"
          git push
