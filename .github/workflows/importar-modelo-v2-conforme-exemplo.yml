name: Importar Modelo V2 Conforme Exemplo

on:
  push:
    branches: [main]
    paths:
      - '.github/importar-modelo-v2-conforme-exemplo-trigger.txt'

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    env:
      XLSX_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-2654-820e-98a6-c24cef712a42/raw?se=2026-07-29T19:09:44Z&sp=r&sv=2026-02-06&sr=b&scid=fc6285ae-6996-5388-9ba1-4c3d5185e1b7&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-29T11:58:01Z&ske=2026-07-31T11:58:01Z&sks=b&skv=2026-02-06&sig=VDlXEbwuC9bSa6zh0PAyIHsuuG5lFt7dFP8%2BHuk1UUo%3D"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar HTML oficial estável
        shell: bash
        run: |
          git show 73c078d3780f21911bbf5a5dbb3f280bbf7f4f22:Planejamento-Colaborativo/index.html > Planejamento-Colaborativo/index.html

      - name: Preparar Python
        run: pip install openpyxl

      - name: Baixar planilha v2
        run: curl -L --fail --retry 3 "$XLSX_URL" -o /tmp/modelo-v2.xlsx

      - name: Gerar base interna conforme documento de orientação
        shell: bash
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          from collections import defaultdict
          from pathlib import Path
          import json, math, re, unicodedata

          repo = Path('.')
          html_path = repo / 'Planejamento-Colaborativo/index.html'
          source_path = repo / 'Cronogramas Planejamento/index.html'
          data_path = repo / 'Planejamento-Colaborativo/model-v2-data.js'
          html = html_path.read_text(encoding='utf-8')
          source_html = source_path.read_text(encoding='utf-8')

          def extract_json(text, variable):
              marker = 'var ' + variable + '='
              start = text.find(marker)
              if start < 0:
                  return None
              start += len(marker)
              opening = text[start]
              closing = '}' if opening == '{' else ']'
              depth = 0
              quoted = False
              escaped = False
              for i in range(start, len(text)):
                  ch = text[i]
                  if quoted:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == '"':
                          quoted = False
                  else:
                      if ch == '"':
                          quoted = True
                      elif ch == opening:
                          depth += 1
                      elif ch == closing:
                          depth -= 1
                          if depth == 0:
                              return json.loads(text[start:i+1])
              return None

          old = extract_json(source_html, 'contractData') or {}

          def norm(value):
              value = unicodedata.normalize('NFKD', str(value or '')).encode('ascii','ignore').decode().lower()
              return re.sub(r'\s+', ' ', value).strip()

          old_lookup = defaultdict(list)
          for contract, rows in old.items():
              for row in rows:
                  old_lookup[(contract, norm(row.get('name')))].append(row)

          wb = load_workbook('/tmp/modelo-v2.xlsx', data_only=True, read_only=False)
          ws = wb['Planilha1']

          plan_qty_cols = [15,20,25,30,35,40]
          plan_value_cols = [16,21,26,31,36,41]
          exec_qty_cols = [17,22,27,32,37,42]
          exec_value_cols = [18,23,28,33,38,43]
          os_cols = [19,24,29,34,39,44]

          merged_os = {}
          for merged in ws.merged_cells.ranges:
              if merged.min_col == merged.max_col and merged.min_col in os_cols:
                  value = ws.cell(merged.min_row, merged.min_col).value
                  for row_index in range(merged.min_row, merged.max_row + 1):
                      merged_os[(row_index, merged.min_col)] = value

          def number(value):
              try:
                  x = float(value or 0)
                  return x if math.isfinite(x) else 0.0
              except Exception:
                  return 0.0

          def text(value):
              return '' if value is None else str(value).strip()

          def monthly_os(row_index, col):
              return text(merged_os.get((row_index, col), ws.cell(row_index, col).value))

          contracts = defaultdict(list)
          occurrences = defaultdict(lambda: defaultdict(int))
          skipped_headers = 0

          for row_index in range(3, ws.max_row + 1):
              code = text(ws.cell(row_index, 1).value)
              contract = text(ws.cell(row_index, 2).value)
              name = text(ws.cell(row_index, 3).value)
              if not contract or not name:
                  continue

              unit_raw = ws.cell(row_index, 4).value
              unit = text(unit_raw) if unit_raw not in (None, 0, '0') else ''
              price_unit = number(ws.cell(row_index, 5).value)
              balance_j = number(ws.cell(row_index, 10).value)
              accumulated_l = number(ws.cell(row_index, 12).value)

              plan = [0.0] * 12
              plan_value = [0.0] * 12
              executed = [0.0] * 12
              exec_value = [0.0] * 12
              orders = [''] * 12

              for month in range(6):
                  plan[month] = number(ws.cell(row_index, plan_qty_cols[month]).value)
                  plan_value[month] = number(ws.cell(row_index, plan_value_cols[month]).value)
                  executed[month] = number(ws.cell(row_index, exec_qty_cols[month]).value)
                  exec_value[month] = number(ws.cell(row_index, exec_value_cols[month]).value)
                  orders[month] = monthly_os(row_index, os_cols[month])

              # Não existe programação mensal de julho em diante nessa planilha.
              # A coluna J é saldo atual, e não planejamento de julho.
              has_activity = any(abs(v) > 1e-12 for v in plan + plan_value + executed + exec_value)
              is_item = bool(unit or price_unit or balance_j or accumulated_l or has_activity)
              if not is_item:
                  skipped_headers += 1
                  continue

              occurrences[contract][name] += 1
              occurrence = occurrences[contract][name]
              fallback_list = old_lookup.get((contract, norm(name)), [])
              fallback = fallback_list[min(occurrence - 1, len(fallback_list) - 1)] if fallback_list else {}
              source_id = str(fallback.get('sourceId') or f'v2-r{row_index}')

              # Para manter o cálculo de saldo do HTML: quantidade original = acumulado + saldo atual.
              contractual = accumulated_l + balance_j

              contracts[contract].append({
                  'sourceId': source_id,
                  'sourceRow': row_index,
                  'code': code,
                  'name': name,
                  'unit': unit or text(fallback.get('unit')) or 'un.',
                  'price': price_unit,
                  'contractual': contractual,
                  'base': accumulated_l,
                  'balance': balance_j,
                  'plan': plan,
                  'planValue': plan_value,
                  'exec': executed,
                  'execValue': exec_value,
                  'orders': orders,
                  'occurrence': occurrence
              })

          model = {
              'metadata': {
                  'source': 'Modelo Cronograma Base de Dados  v2.xlsx',
                  'sheet': 'Planilha1',
                  'updatedAt': '2026-07-29T18:00:36Z',
                  'contracts': len(contracts),
                  'items': sum(len(rows) for rows in contracts.values()),
                  'skippedCategoryRows': skipped_headers,
                  'months': 'Janeiro a Junho/2026',
                  'mapping': {
                      'contract': 'B - Codigo e Nome da Obra',
                      'item': 'C - Item/CPU - SIENGE',
                      'unit': 'D - Unid serviço/Coef Insumo',
                      'unitPrice': 'E - Preço Unit',
                      'balance': 'J - Quant. Total JULHO 2026',
                      'plannedQuantity': 'Qnt Realis.',
                      'plannedValue': 'R$ Realista',
                      'executedQuantity': 'Qtd. Executada',
                      'executedValue': 'R$ Executado',
                      'serviceOrder': 'Ordem de Serviço mensal replicada aos itens do contrato'
                  }
              },
              'contractData': dict(contracts)
          }
          data_path.write_text('window.SINAPE_MODEL_V2=' + json.dumps(model, ensure_ascii=False, separators=(',',':')) + ';\n', encoding='utf-8')

          if 'src="model-v2-data.js"' not in html:
              html = html.replace('<script>!async function(){', '<script src="model-v2-data.js"></script><script>!async function(){', 1)

          old_reader = 'function t(t){var n="var "+t+"="'
          new_reader = 'function t(t){if(window.SINAPE_MODEL_V2&&Object.prototype.hasOwnProperty.call(window.SINAPE_MODEL_V2,t))return window.SINAPE_MODEL_V2[t];var n="var "+t+"="'
          if old_reader in html:
              html = html.replace(old_reader, new_reader, 1)
          elif new_reader not in html:
              raise RuntimeError('Função de leitura da base não localizada')

          old_planned_value = 'function Z(e){return oe(!0).reduce(function(t,n){return t+Number(n.plan[e]||0)*n.price},0)}'
          new_planned_value = 'function Z(e){return oe(!0).reduce(function(t,n){var a=n.planValue||[];return t+Number(a[e]||0)},0)}'
          if old_planned_value in html:
              html = html.replace(old_planned_value, new_planned_value, 1)
          elif new_planned_value not in html:
              raise RuntimeError('Cálculo do valor planejado não localizado')

          # Mostrar a tela de e-mail em toda nova abertura/recarregamento.
          html = html.replace('b=sessionStorage.getItem(f)||""', 'b=""', 1)

          old_clear = 'document.getElementById("clearFilters").onclick=function(){c=d,s="Todas",m="",l=[],u="",Be.value=String(d),document.getElementById("osFilter").value="Todas",document.getElementById("statusFilter").value="",Ee(),we(),xe()}'
          new_clear = 'document.getElementById("clearFilters").onclick=function(){L=C,q=T(L),c=-1,s="Todas",m="",l=[],u="",Ie.value=C,Be.value="-1",document.getElementById("itemFilter").value="",document.getElementById("osFilter").value="Todas",document.getElementById("statusFilter").value="",document.getElementById("advancedFilters").classList.remove("open"),ke(!1),Ee(),we(),xe()}'
          if old_clear in html:
              html = html.replace(old_clear, new_clear, 1)

          html = html.replace('Fonte: Modelo Cronograma + Base BI Executado (2)', 'Planejado e Executado: Modelo Cronograma Base de Dados v2 · RDO: Base BI Executado (2)')
          html = html.replace('Planejamento: base atual · Executado/RDO: <b>Base BI Executado (2) atualizada</b>', 'Planejado, Executado e OS: <b>Modelo Cronograma Base de Dados v2</b> · RDO: Base BI Executado (2)')
          html = html.replace('Fonte: Base BI Executado (2)', 'Fonte: Modelo Cronograma Base de Dados v2')
          html = html.replace('Planejamento: Modelo Cronograma Base de Dados · Planilha1', 'Planejamento, Executado e OS: Modelo Cronograma Base de Dados v2 · base interna')
          html = html.replace('Executado e RDO: Estudo Geral · Base BI Executado (2)', 'RDO: Estudo Geral · Base BI Executado (2) · somente quantidade')
          html = html.replace('Quantitativos e valores executados provenientes da Base BI Executado (2)', 'Registros operacionais provenientes da Base BI Executado (2), sem exibição do valor financeiro')

          old_rdo_head = '<th>Contrato</th><th>Período</th><th>Observação do RDO</th><th>Serviço executado</th><th>Quantidade</th><th>Valor executado</th>'
          new_rdo_head = '<th>Contrato</th><th>Período</th><th>Observação do RDO</th><th>Serviço executado</th><th>Quantidade executada</th>'
          html = html.replace(old_rdo_head, new_rdo_head)
          old_rdo_row = '+P.format(e.quantity)+" "+D(e.unit)+"</td><td><strong>"+A.format(e.value)+"</strong></td></tr>"'
          new_rdo_row = '+P.format(e.quantity)+" "+D(e.unit)+"</td></tr>"'
          html = html.replace(old_rdo_row, new_rdo_row)

          html_path.write_text(html, encoding='utf-8')

          # Validação do exemplo apresentado no documento: contrato 2465.
          rows_2465 = contracts.get('2465 - DER SP', [])
          sample = next((x for x in rows_2465 if x['name'].startswith('Oper. e Manutenção de Canteiro Tipo I')), None)
          assert sample, 'Item de validação do contrato 2465 não encontrado'
          assert abs(sample['price'] - 181544.96) < 0.01, sample['price']
          assert abs(sample['balance'] - 0.9310882977412528) < 1e-9, sample['balance']
          assert abs(sample['exec'][0] - 0.08) < 1e-9, sample['exec'][0]
          assert abs(sample['execValue'][0] - 14523.5968) < 0.01, sample['execValue'][0]
          assert all(abs(v) < 1e-12 for v in sample['plan'][6:]), sample['plan']
          print(json.dumps(model['metadata'], ensure_ascii=False, indent=2))
          print('VALIDACAO_2465', json.dumps({k: sample[k] for k in ['name','price','balance','plan','planValue','exec','execValue','orders']}, ensure_ascii=False))
          PY

      - name: Validar HTML e base gerada
        shell: bash
        run: |
          test -s Planejamento-Colaborativo/model-v2-data.js
          grep -q 'planValue' Planejamento-Colaborativo/model-v2-data.js
          grep -q 'b=""' Planejamento-Colaborativo/index.html
          grep -q 'c=-1,s="Todas"' Planejamento-Colaborativo/index.html
          grep -q 'RDO: Estudo Geral' Planejamento-Colaborativo/index.html
          grep -q 'Quantidade executada</th>' Planejamento-Colaborativo/index.html

      - name: Publicar correção
        shell: bash
        run: |
          git config user.name "SINAPE Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Planejamento-Colaborativo/index.html Planejamento-Colaborativo/model-v2-data.js
          git commit -m "Corrige leitura de planejado e executado conforme Modelo v2"
          git push
