name: Corrigir acesso direto no HTML
on:
  issues:
    types: [opened]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: contains(github.event.issue.title, '[corrigir-acesso-dashboard-v5]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir overlay de acesso
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('Planejamento-Colaborativo/index.html')
          t=p.read_text(encoding='utf-8')
          patch=r'''<script id="SINAPE_ACCESS_BYPASS_V5">(function(){function unlock(){var g=document.getElementById('accessGate');if(g){g.hidden=true;g.style.setProperty('display','none','important');g.style.setProperty('visibility','hidden','important');g.style.setProperty('pointer-events','none','important');g.setAttribute('aria-hidden','true')}if(document.body){document.body.classList.remove('access-pending');document.body.style.setProperty('overflow','auto','important')}document.documentElement.setAttribute('data-dashboard-access','granted')}function bind(){var form=document.getElementById('accessForm');var button=form&&form.querySelector('button');var email=document.getElementById('accessEmail');if(form)form.addEventListener('submit',function(e){e.preventDefault();try{localStorage.setItem('sinape_dashboard_email',String(email&&email.value||'visualizacao@sinape.com.br').trim().toLowerCase())}catch(x){}unlock()},true);if(button){button.type='button';button.onclick=function(e){e&&e.preventDefault();unlock();return false}}unlock();setTimeout(unlock,100);setTimeout(unlock,500);setTimeout(unlock,1500)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind,{once:true});else bind();window.addEventListener('load',unlock,{once:true})})();</script>'''
          t=re.sub(r'<script id="SINAPE_ACCESS_BYPASS_V[0-9]+">.*?</script>','',t,flags=re.S)
          t=t.replace('</head>',patch+'</head>',1)
          p.write_text(t,encoding='utf-8')
      - name: Validar
        run: |
          grep -q 'SINAPE_ACCESS_BYPASS_V5' Planejamento-Colaborativo/index.html
          grep -q "document.getElementById('accessGate')" Planejamento-Colaborativo/index.html
          grep -q "classList.remove('access-pending')" Planejamento-Colaborativo/index.html
          python - <<'PY'
          from pathlib import Path
          t=Path('Planejamento-Colaborativo/index.html').read_text(encoding='utf-8')
          assert t.count('SINAPE_ACCESS_BYPASS_V5')==1
          assert t.rstrip().endswith('</html>')
          assert not any(x in t for x in ('<<<<<<<','=======','>>>>>>>'))
          print('Overlay de acesso removido corretamente')
          PY
      - name: Publicar
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Planejamento-Colaborativo/index.html
          git diff --cached --quiet || (git commit -m 'Remove overlay de acesso e libera dashboard' && git push)
