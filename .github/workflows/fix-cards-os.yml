name: Corrigir vinculo da base do Planejamento Colaborativo
on:
  push:
    paths: ['.github/workflows/fix-cards-os.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar dados do contrato 2465 em junho
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip, json
          parts=[]
          for i in range(8):
              p=Path(f'Planejamento-Colaborativo/data/direct-overrides.part{i}')
              if not p.exists(): raise SystemExit(f'Bloco ausente: {p}')
              parts.append(p.read_text(encoding='utf-8'))
          raw=base64.b64decode(''.join(parts).replace('\n','').replace('\r','').replace(' ',''))
          rows=json.loads(gzip.decompress(raw).decode('utf-8'))
          contract=[r for r in rows if str(r.get('contract','')).split(' - ')[0]=='2465']
          month=5
          planned_items=[r for r in contract if float((r.get('plan') or [0]*12)[month] or 0)>0]
          planned_value=sum(float((r.get('plan') or [0]*12)[month] or 0)*float(r.get('price') or 0) for r in contract)
          executed_value=sum(float((r.get('exec') or [0]*12)[month] or 0)*float(r.get('price') or 0) for r in contract)
          executed_qty=sum(float((r.get('exec') or [0]*12)[month] or 0) for r in contract)
          print({'rows_2465':len(contract),'planned_items_june':len(planned_items),'planned_value_june':planned_value,'executed_qty_june':executed_qty,'executed_value_june':executed_value})
          if not contract: raise SystemExit('Contrato 2465 nao encontrado na base atualizada')
          if not planned_items or planned_value<=0: raise SystemExit('Planejado de junho do contrato 2465 esta zerado na base')
          if executed_qty<=0 or executed_value<=0: raise SystemExit('Executado de junho do contrato 2465 esta zerado na base')
      - name: Carregar base atualizada antes do painel
        shell: python
        run: |
          from pathlib import Path
          p=Path('Planejamento-Colaborativo/index.html')
          t=p.read_text(encoding='utf-8')
          loader='<script src="data/direct-model-runtime.js?v=financefix20260731"></script>'
          marker='<script>!async function(){'
          if loader not in t:
              if marker not in t: raise SystemExit('Script principal nao localizado')
              t=t.replace(marker,loader+marker,1)
          if t.index(loader)>t.index(marker): raise SystemExit('Modulo de dados carregado depois do painel')
          p.write_text(t,encoding='utf-8')
      - name: Validar integridade
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('Planejamento-Colaborativo/index.html').read_text(encoding='utf-8')
          checks={
            'Modulo de dados': t.count('data/direct-model-runtime.js?v=financefix20260731')==1,
            'Ordem de carregamento': t.index('data/direct-model-runtime.js')<t.index('<script>!async function(){'),
            'Contrato': 'contractFilter' in t,
            'Card planejado': 'Valor planejado' in t,
            'Card executado': 'Valor executado' in t,
            'Card itens': 'Itens do Contrato' in t,
            'Plano de execucao': 'planningViewport' in t,
            'Ordens de servico': 'osRows' in t,
            'RDO': 'rdoContent' in t,
            'Sem conflitos': not any(x in t for x in ('<<<<<<<','=======','>>>>>>>')),
          }
          print('\n'.join(k+': '+('OK' if v else 'FALHA') for k,v in checks.items()))
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit(', '.join(bad))
          inline=re.findall(r'<script>(.*?)</script>',t,re.S)
          Path('/tmp/app.js').write_text('\n'.join(inline),encoding='utf-8')
          PY
          node --check /tmp/app.js
          node --check Planejamento-Colaborativo/data/direct-model-runtime.js
      - name: Publicar correcao
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Planejamento-Colaborativo/index.html
          git diff --cached --quiet || (git commit -m 'Corrige vinculo da base e valores do contrato 2465' && git push)
