name: Restaurar Planejamento Colaborativo Estavel
on:
  issues:
    types: [opened]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    if: contains(github.event.issue.title, '[restaurar-planejamento-estavel]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restaurar visual aprovado
        run: |
          git fetch origin planejamento-colaborativo-fix-73c078d
          git show origin/planejamento-colaborativo-fix-73c078d:Planejamento-Colaborativo/index.html > /tmp/index.html
      - name: Remover tela de acesso fisicamente
        shell: python
        run: |
          from pathlib import Path
          import re
          t=Path('/tmp/index.html').read_text(encoding='utf-8')
          t,n=re.subn(r'<section class="access-gate".*?</section>','',t,count=1,flags=re.S)
          if n!=1: raise SystemExit('Tela de acesso nao localizada')
          t=t.replace('<body class="access-pending">','<body>',1)
          t=re.sub(r'<script id="SINAPE_ACCESS_BYPASS_V[0-9]+">.*?</script>','',t,flags=re.S)
          t=re.sub(r'<script src="data/direct-model-runtime\.js\?v=[^"]+"></script>','',t)
          if 'accessGate' in t or 'access-pending' in t: raise SystemExit('Bloqueio de acesso ainda presente')
          Path('Planejamento-Colaborativo/index.html').write_text(t,encoding='utf-8')
          Path('Planejamento-Colaborativo-Homologacao').mkdir(exist_ok=True)
          Path('Planejamento-Colaborativo-Homologacao/index.html').write_text(t,encoding='utf-8')
      - name: Validar HTML e JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for f in ['Planejamento-Colaborativo/index.html','Planejamento-Colaborativo-Homologacao/index.html']:
              t=Path(f).read_text(encoding='utf-8')
              assert t.rstrip().endswith('</html>')
              assert 'accessGate' not in t
              assert 'access-pending' not in t
              assert 'contractFilter' in t
              assert 'monthFilter' in t
              assert 'planningViewport' in t
              assert 'rdoContent' in t
              scripts=re.findall(r'<script[^>]*>(.*?)</script>',t,re.S)
              Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Publicar versao estavel
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Planejamento-Colaborativo/index.html Planejamento-Colaborativo-Homologacao/index.html
          git diff --cached --quiet || (git commit -m 'Restaura dashboard estavel sem tela de acesso' && git push)
