name: Restaurar e corrigir Planejamento Colaborativo
on:
  push:
    paths: ['.github/workflows/fix-cards-os.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restaurar HTML correto
        run: |
          git fetch origin planejamento-colaborativo-fix-73c078d
          git show origin/planejamento-colaborativo-fix-73c078d:Planejamento-Colaborativo/index.html > Planejamento-Colaborativo/index.html
      - name: Corrigir filtros cards e ordens de servico
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('Planejamento-Colaborativo/index.html')
          t=p.read_text(encoding='utf-8')

          old='function oe(e){var t=V();return q.filter(function(n){return!(m&&R(n)!==m||"Todas"!==s&&n.orders.indexOf(p)<0||!1!==e&&u&&re(n,t)!==u)})}'
          new='function oe(e){var t=V();return q.filter(function(n){var a=c<0?n.orders.some(function(e){e=String(e||"").trim();return e&&e!=="Sem serviços"&&e!=="Sem servicos"}):function(e){e=String(n.orders[t]||"").trim();return e&&e!=="Sem serviços"&&e!=="Sem servicos"}();return!(m&&R(n)!==m||"Todas"!==s&&!a||!1!==e&&u&&re(n,t)!==u)})}'
          if old not in t: raise SystemExit('Filtro principal nao localizado')
          t=t.replace(old,new,1)

          old_card='<article class="card '+"'"+'+(a.some(function(t){return"Urgente"===re(t,e)})?"red":"amber")+'+"'"+'"><div class="card-label">Itens planejados do contrato</div><strong>'+"'"+'+a.length+'+"'"+'</strong><small>Itens com quantidade planejada no mês operacional</small><div class="mini-status '+"'"+'+(a.some(function(t){return"Urgente"===re(t,e)})?"danger":"warn")+'+"'"+'"><i></i>'+"'"+'+a.filter(function(t){return"Urgente"===re(t,e)}).length+'+"'"+' urgentes</div></article>'
          new_card='<article class="card '+"'"+'+(a.some(function(t){return"Urgente"===re(t,e)})?"red":"amber")+'+"'"+'"><div class="card-label">Itens do Contrato</div><strong>'+"'"+'+Array.from(new Set(oe(!1).map(function(t){return R(t)}))).length+'+"'"+'</strong><small>Itens contratuais únicos do filtro selecionado</small><div class="mini-status '+"'"+'+(a.some(function(t){return"Urgente"===re(t,e)})?"danger":"warn")+'+"'"+'"><i></i>'+"'"+'+a.length+'+"'"+' planejados no período</div></article>'
          if old_card not in t: raise SystemExit('Card de itens nao localizado')
          t=t.replace(old_card,new_card,1)

          pattern=r'function\(\)\{var e,t=V\(\);e=c<0\?oe\(!0\).*?\}\(\),function\(\)\{var e=V\(\),t=F\(\),n=\{\};'
          repl='''function(){var e=V(),t=[];if(c<0){oe(!0).forEach(function(n){r.forEach(function(a,i){var d=Number(n.plan[i]||0),l=W(n,i),s=String(n.orders[i]||"").trim();if(d>0||l>0||s&&s!=="Sem serviços"&&s!=="Sem servicos")t.push({item:n,month:i})})})}else oe(!0).forEach(function(n){var a=Number(n.plan[e]||0),r=W(n,e),o=String(n.orders[e]||"").trim();if(a>0||r>0||o&&o!=="Sem serviços"&&o!=="Sem servicos")t.push({item:n,month:e})});document.getElementById("osTitle").textContent=c<0?"Ordens de Serviço planejadas em 2026":"O que deve ser executado em "+o[e]+"/2026",document.getElementById("osRows").innerHTML=t.length?t.map(function(t,n){var a=t.item,i=t.month,d=Number(a.plan[i]||0),l=W(a,i),s=re(a,i),u=String(a.orders[i]||"").trim();u&&u!=="Sem serviços"&&u!=="Sem servicos"||(u="Sem Ordem de Serviço informada para o período");var m=function(e,t){var n=_(e,t),a=[];return te(t).forEach(function(t){var r=n[t.week];r&&(Number(r.quantity)>0||r.order)&&a.push("Sem. "+t.week+": "+P.format(Number(r.quantity)||0)+" "+e.unit+(r.order?" · "+r.order:""))}),a.join(" | ")}(a,i),p=m?u+" | "+m:u;return'<tr><td><span class="os-code">OS-'+String(n+1).padStart(2,"0")+'</span></td><td><strong>'+D(a.name)+"</strong><small>"+(L===C?"Contrato "+D(H(a))+" · ":"")+o[i]+"/2026</small></td><td><strong>"+P.format(d)+"</strong> "+D(a.unit)+"</td><td><strong>"+P.format(l)+"</strong> "+D(a.unit)+'</td><td><span class="status-pill '+se(s)+'"><i></i>'+s+"</span></td><td>"+D(p)+"</td></tr>"}).join(""):'<tr><td colspan="6" style="text-align:center;color:#687986;padding:24px">Nenhuma Ordem de Serviço prevista neste recorte.</td></tr>'}(),function(){var e=V(),t=F(),n={};'''
          t,n=re.subn(pattern,repl,t,count=1,flags=re.S)
          if n!=1: raise SystemExit('Bloco de OS nao localizado')

          if not t.endswith('</html>') and not t.endswith('</html>\n'): raise SystemExit('HTML incompleto')
          if any(x in t for x in ('<<<<<<<','=======','>>>>>>>')): raise SystemExit('Conflito de merge encontrado')
          p.write_text(t,encoding='utf-8')
      - name: Validar HTML e JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('Planejamento-Colaborativo/index.html').read_text(encoding='utf-8')
          checks={
            'HTML correto': 'Planejamento x Executado' not in t and 'Planejado x Executado' in t,
            'Card correto': 'Itens do Contrato' in t,
            'OS mensal': 'Sem Ordem de Serviço informada para o período' in t,
            'OS sequencial': 'String(n+1).padStart(2,"0")' in t,
            'Filtro mensal': 'n.orders[t]' in t,
            'Tela de acesso': 'accessGate' in t,
            'Plano de execucao': 'planningViewport' in t,
            'RDO': 'rdoContent' in t,
          }
          bad=[k for k,v in checks.items() if not v]
          print('\n'.join(k+': '+('OK' if v else 'FALHA') for k,v in checks.items()))
          if bad: raise SystemExit(', '.join(bad))
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',t,re.S)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Publicar no mesmo link
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Planejamento-Colaborativo/index.html
          git diff --cached --quiet || (git commit -m 'Restaura visual correto e corrige filtros cards e OS' && git push)
