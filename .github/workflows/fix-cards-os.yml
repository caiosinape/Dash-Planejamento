name: Restaurar integridade do Planejamento Colaborativo
on:
  push:
    paths: ['.github/workflows/fix-cards-os.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restaurar bloco de dados parcialmente alterado
        run: |
          git checkout 0ce951ad8e479bbf3ed553778665cef093824f5e -- Planejamento-Colaborativo/data/direct-overrides.part0
      - name: Validar pacote atual
        run: |
          test -s Planejamento-Colaborativo/data/direct-model-runtime.js
          for i in 0 1 2 3 4 5 6 7; do test -s Planejamento-Colaborativo/data/direct-overrides.part$i; done
          node --check Planejamento-Colaborativo/data/direct-model-runtime.js
      - name: Publicar restauracao
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Planejamento-Colaborativo/data/direct-overrides.part0
          git diff --cached --quiet || (git commit -m 'Restaura integridade do pacote de dados' && git push)
