name: Corrigir acesso direto no HTML
on:
  issues:
    types: [opened]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: contains(github.event.issue.title, '[corrigir-acesso-dashboard]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inserir desbloqueio inline
        shell: python
        run: |
          from pathlib import Path
          p=Path('Planejamento-Colaborativo/index.html')
          t=p.read_text(encoding='utf-8')
          marker='SINAPE_ACCESS_BYPASS_V4'
          patch=r'''<script id="SINAPE_ACCESS_BYPASS_V4">(function(){function txt(e){return String((e&&(e.textContent||e.value))||'').trim().toLowerCase()}function findGate(){var all=[].slice.call(document.querySelectorAll('body *'));for(var i=0;i<all.length;i++){if(txt(all[i]).indexOf('acessar o dashboard')>=0){var n=all[i];while(n&&n!==document.body){var s=getComputedStyle(n);if(s.position==='fixed'||s.position==='absolute'||(n.offsetWidth>400&&n.offsetHeight>300))return n;n=n.parentElement}}}return null}function unlock(){var g=findGate();if(g){g.style.setProperty('display','none','important');g.style.setProperty('visibility','hidden','important');g.style.setProperty('opacity','0','important');g.style.setProperty('pointer-events','none','important');g.setAttribute('aria-hidden','true')}document.documentElement.setAttribute('data-dashboard-access','granted');document.body.style.setProperty('overflow','auto','important')}function bind(){var email=document.querySelector('input[type="email"],input[placeholder*="sinape" i]');var btn=[].slice.call(document.querySelectorAll('button,input[type="submit"],input[type="button"]')).find(function(e){return txt(e)==='continuar'});if(btn){btn.type='button';btn.addEventListener('click',function(e){e.preventDefault();try{localStorage.setItem('sinape_dashboard_email',String(email&&email.value||'visualizacao@sinape.com.br').trim().toLowerCase())}catch(x){}unlock()},true)}if(email)email.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();unlock()}},true);unlock();setTimeout(unlock,500);setTimeout(unlock,1500);setTimeout(unlock,4000)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind,{once:true});else bind();window.addEventListener('load',bind,{once:true})})();</script>'''
          import re
          t=re.sub(r'<script id="SINAPE_ACCESS_BYPASS_V[0-9]+">.*?</script>','',t,flags=re.S)
          t=t.replace('</head>',patch+'</head>',1)
          p.write_text(t,encoding='utf-8')
      - name: Validar
        run: |
          grep -q 'SINAPE_ACCESS_BYPASS_V4' Planejamento-Colaborativo/index.html
          python - <<'PY'
          from pathlib import Path
          t=Path('Planejamento-Colaborativo/index.html').read_text(encoding='utf-8')
          assert t.count('SINAPE_ACCESS_BYPASS_V4')==1
          assert t.rstrip().endswith('</html>')
          assert not any(x in t for x in ('<<<<<<<','=======','>>>>>>>'))
          print('Acesso validado')
          PY
      - name: Publicar
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Planejamento-Colaborativo/index.html
          git diff --cached --quiet || (git commit -m 'Remove definitivamente bloqueio da tela de acesso' && git push)
