name: Repair Planejamento Main JS

on:
  push:
    branches: [main]
    paths:
      - '.github/repair-main-js-trigger.txt'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remover quebra inválida dentro da string do PDF
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('Planejamento-Colaborativo/index.html')
          html = path.read_text(encoding='utf-8')
          before = html

          html, count = re.subn(
              r'(<\\/script>)\s+(</body></html>"\),n\.document\.close\(\))',
              r'\1\2',
              html,
              count=1
          )

          if count != 1:
              raise RuntimeError(f'Trecho quebrado não localizado de forma única: {count}')

          if html == before:
              raise RuntimeError('Nenhuma alteração foi realizada')

          path.write_text(html, encoding='utf-8')
          PY

      - name: Publicar reparo
        shell: bash
        run: |
          git config user.name "SINAPE Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Planejamento-Colaborativo/index.html
          git commit -m "Corrige JavaScript da tela de acesso"
          git push
