name: Montar Planejamento Colaborativo saudável v2

on:
  push:
    branches:
      - planejamento-colaborativo-health-v1
    paths:
      - 'Planejamento-Colaborativo/.health-v2/ready.txt'

permissions:
  contents: write

concurrency:
  group: planejamento-colaborativo-health-v2
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[health-v2-build]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          ref: planejamento-colaborativo-health-v1
          fetch-depth: 0

      - name: Montar HTML único e restaurar ativos visuais
        shell: bash
        run: |
          set -euo pipefail
          cd 'Planejamento-Colaborativo'
          test "$(find .health-v2 -maxdepth 1 -name 'part-*.txt' | wc -l)" -eq 16
          cat .health-v2/part-*.txt | base64 -d | gzip -d > index.html
          echo '2acbec753ee023aa37fe032bb1ef0886aa98c9277c837ce15aa4279f1c61b3a0  index.html' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import json, re, subprocess, hashlib
          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')
          reference = subprocess.check_output(['git','show','73c078d3780f21911bbf5a5dbb3f280bbf7f4f22:Cronogramas Planejamento/index.html'], text=True)
          road_match = re.search(r'data:image/webp;base64,[A-Za-z0-9+/=]+', reference)
          logo_match = re.search(r'data:image/png;base64,[A-Za-z0-9+/=]+', reference)
          if not road_match or not logo_match:
              raise SystemExit('Ativos visuais da referência 73c078d não encontrados')
          html = re.sub(r'url\("data:image/svg\+xml;base64,[A-Za-z0-9+/=]+"\)', 'url("'+road_match.group(0)+'")', html, count=1)
          html = re.sub(r'src="data:image/svg\+xml;base64,[A-Za-z0-9+/=]+"', 'src="'+logo_match.group(0)+'"', html)
          html_path.write_text(html, encoding='utf-8')
          audit = {'status':'valid','visualReference':'73c078d3780f21911bbf5a5dbb3f280bbf7f4f22','contracts':15,'items':650,'orders':13,'sha256':hashlib.sha256(html.encode('utf-8')).hexdigest()}
          Path('health-v2-audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          grep -q 'id="sinapeModelBundle"' index.html
          grep -q 'Arquitetura saudável v1' index.html
          grep -q 'Mapa de criticidade' index.html
          grep -q 'Avanço contratual' index.html
          grep -q 'Modelo Cronograma Base de Dados  v2.xlsx' index.html
          if grep -q 'document.write' index.html; then echo 'document.write não permitido'; exit 1; fi
          if grep -q 'index-core.html' index.html; then echo 'dependência index-core não permitida'; exit 1; fi
          if grep -q 'direct-model-runtime.js' index.html; then echo 'runtime legado não permitido'; exit 1; fi
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s+[^>]*)?>(.*?)</script>',html,flags=re.S)
          executable=[s for s in scripts if 'sinapeModelBundle' not in s and s.strip()]
          if not executable:
              raise SystemExit('JavaScript principal não encontrado')
          Path('/tmp/health-v2-app.js').write_text(executable[-1],encoding='utf-8')
          PY
          node --check /tmp/health-v2-app.js
          rm -rf .health-v2

      - name: Publicar resultado validado na branch de recuperação
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Planejamento-Colaborativo/index.html' 'Planejamento-Colaborativo/health-v2-audit.json' 'Planejamento-Colaborativo/.health-v2'
          git commit -m '[health-v2-build] Publica HTML saudável com visual 73c078d' || exit 0
          git push origin HEAD:planejamento-colaborativo-health-v1
