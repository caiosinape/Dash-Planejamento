name: Atualizacao da base do Planejamento Colaborativo (desativada)

# Este workflow foi desativado porque dependia de URLs temporarias e gerava
# publicacoes parciais dos cinco arquivos da base. A base validada deve ser
# publicada de forma atomica, no mesmo commit, sem alterar o HTML de acesso.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Informar modo seguro
        run: |
          echo "Atualizacao automatica desativada."
          echo "Publique model-v2.part0 a part4, auditoria e manifesto no mesmo commit."
